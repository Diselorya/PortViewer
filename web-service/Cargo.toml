[package]
name = "portviewer-web"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Local-only WebGUI service for PortViewer"

[dependencies]
axum = "0.8.9"
rand = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.1.4", features = ["schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.1"
subtle = "2.6.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
portviewer-app = { path = "../src-tauri", features = ["custom-protocol"] }

[target.'cfg(target_os = "linux")'.dependencies]
netstat2 = "0.11.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

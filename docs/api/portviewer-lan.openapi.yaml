openapi: 3.1.0
info:
  title: PortViewer LAN Port API
  version: 1.0.0
  description: LAN-only read API. Anonymous responses contain occupancy only; Bearer authentication unlocks endpoint details.
servers:
  - url: http://127.0.0.1:17890
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ports/check:
    get:
      operationId: checkPorts
      parameters:
        - name: ports
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
          examples:
            single: { value: "3000" }
            listAndRange: { value: "80,443,3000-3010" }
        - name: protocol
          in: query
          schema:
            $ref: "#/components/schemas/ProtocolSelector"
        - name: details
          in: query
          schema:
            type: boolean
            default: false
          description: Requires Bearer authentication when true.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Occupancy results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Busy" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServerError" }
        "504": { $ref: "#/components/responses/ServerError" }
  /api/v1/ports/free:
    post:
      operationId: findFreePort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreePortRequest"
      responses:
        "200":
          description: A currently bindable advisory port
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreePortResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Busy" }
        "500": { $ref: "#/components/responses/ServerError" }
        "504": { $ref: "#/components/responses/ServerError" }
  /api/v1/knowledge/profiles:
    {
      "post":
        {
          "description": "Available to same-origin loopback GUI. LAN access requires a configured and valid Bearer token; metadata does not establish PID ownership.",
          "security": [{}, { "bearerAuth": [] }],
          "operationId": "getServiceProfiles",
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/ServiceProfilesQuery" },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Cached result; background work never delays the base scan",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/ServiceProfilesResult",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403":
                {
                  "description": "Local-only configuration or disallowed request origin",
                },
              "503": { "$ref": "#/components/responses/ServerError" },
            },
        },
    }
  /api/v1/knowledge/host:
    {
      "get":
        {
          "description": "Available to same-origin loopback GUI. LAN access requires a configured and valid Bearer token; metadata does not establish PID ownership.",
          "security": [{}, { "bearerAuth": [] }],
          "operationId": "getHostContext",
          "parameters":
            [
              {
                "name": "address",
                "in": "query",
                "description": "Numeric IP only; omit to query the scanner host, not the browser machine.",
                "schema": { "type": "string", "maxLength": 64 },
              },
            ],
          "responses":
            {
              "200":
                {
                  "description": "Cached result; background work never delays the base scan",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/HostContext" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403":
                {
                  "description": "Local-only configuration or disallowed request origin",
                },
              "503": { "$ref": "#/components/responses/ServerError" },
            },
        },
    }
  /api/v1/knowledge/settings:
    {
      "get":
        {
          "description": "Available to same-origin loopback GUI. LAN access requires a configured and valid Bearer token; metadata does not establish PID ownership.",
          "security": [{}, { "bearerAuth": [] }],
          "operationId": "getKnowledgeSettings",
          "responses":
            {
              "200":
                {
                  "description": "Cached result; background work never delays the base scan",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/KnowledgeConfiguration",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403":
                {
                  "description": "Local-only configuration or disallowed request origin",
                },
              "503": { "$ref": "#/components/responses/ServerError" },
            },
        },
      "put":
        {
          "description": "Same-origin loopback GUI only. AI can only be enabled after explicit server-side provider configuration.",
          "operationId": "setKnowledgeSettings",
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/KnowledgeSettings" },
                    },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Cached result; background work never delays the base scan",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/KnowledgeConfiguration",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
              "403":
                {
                  "description": "Local-only configuration or disallowed request origin",
                },
              "503": { "$ref": "#/components/responses/ServerError" },
            },
        },
    }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid Bearer Token
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: A scan is already running or no free port was found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Scan failed, timed out, or required server configuration is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ProtocolSelector:
      type: string
      enum: [tcp, udp, both]
      default: tcp
    Health:
      type: object
      required:
        [status, service, platform, mode, apiVersion, tokenDetailsConfigured]
      properties:
        status: { const: ok }
        service: { const: portviewer-web }
        platform: { type: string }
        mode: { type: string }
        apiVersion: { const: 1 }
        tokenDetailsConfigured: { type: boolean }
    CheckResponse:
      type: object
      additionalProperties: false
      required:
        [
          apiVersion,
          detailLevel,
          checkedAt,
          scanComplete,
          requestedPorts,
          requestedProtocol,
          results,
        ]
      properties:
        apiVersion: { const: 1 }
        detailLevel: { type: string, enum: [basic, detailed] }
        checkedAt: { type: string }
        scanComplete: { type: boolean }
        requestedPorts:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
        requestedProtocol: { $ref: "#/components/schemas/ProtocolSelector" }
        results:
          type: array
          items: { $ref: "#/components/schemas/PortStatus" }
        scanWarnings:
          type: array
          items: { type: object, additionalProperties: true }
    PortStatus:
      type: object
      additionalProperties: false
      required: [port, protocol, status, occupied]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [tcp, udp] }
        status: { type: string, enum: [occupied, available, indeterminate] }
        occupied: { type: [boolean, "null"] }
        endpointCount: { type: integer, minimum: 0 }
        isListening: { type: boolean }
        endpoints:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              service_profile_ids:
                type: array
                items: { type: string, maxLength: 128 }
                description: Scanner-registered service profile identifiers.
              service_manager:
                type: string
                enum:
                  [Docker, Systemd, WindowsService, Nssm, Iis, Nginx, Unknown]
                description: Management layer identified from attribution evidence; Unknown does not assert that the process is unmanaged.
    FreePortRequest:
      type: object
      additionalProperties: false
      properties:
        protocol: { $ref: "#/components/schemas/ProtocolSelector" }
        minPort:
          { type: integer, minimum: 30001, maximum: 65535, default: 30001 }
        maxPort:
          { type: integer, minimum: 30001, maximum: 65535, default: 49151 }
    FreePortResponse:
      type: object
      additionalProperties: false
      required:
        [
          apiVersion,
          port,
          protocol,
          minPort,
          maxPort,
          checkedAt,
          attempts,
          advisoryOnly,
          advisory,
        ]
      properties:
        apiVersion: { const: 1 }
        port: { type: integer, minimum: 30001, maximum: 65535 }
        protocol: { $ref: "#/components/schemas/ProtocolSelector" }
        minPort: { type: integer }
        maxPort: { type: integer }
        checkedAt: { type: string }
        attempts: { type: integer, minimum: 1 }
        advisoryOnly: { const: true }
        advisory: { type: string }
    Error:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string, maxLength: 500 }

    PublicServiceId:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["provider", "name"],
        "properties":
          {
            "provider": { "type": "string", "enum": ["github", "npm", "pypi"] },
            "name": { "type": "string", "minLength": 1, "maxLength": 431 },
            "version": { "type": "string", "maxLength": 80 },
          },
      }
    KnowledgeSource:
      {
        "type": "object",
        "required": ["id", "kind", "title", "url", "fetched_at"],
        "properties":
          {
            "id": { "type": "string" },
            "kind":
              {
                "type": "string",
                "enum":
                  ["local", "catalog", "registry", "github", "search", "ai"],
              },
            "title": { "type": "string" },
            "url": { "type": ["string", "null"] },
            "fetched_at": { "type": ["string", "null"] },
          },
      }
    ServiceCandidate:
      {
        "type": "object",
        "required": ["name", "description", "url", "source_id"],
        "properties":
          {
            "name": { "type": "string" },
            "description": { "type": ["string", "null"] },
            "url": { "type": "string", "format": "uri" },
            "source_id": { "type": "string" },
          },
      }
    ServiceProfile:
      {
        "type": "object",
        "required":
          [
            "id",
            "component_role",
            "original_name",
            "display_name_zh",
            "summary",
            "software_summary",
            "identity_match",
            "public_ids",
            "sources",
            "candidates",
            "enrichment_status",
            "updated_at",
            "stale",
            "message",
          ],
        "properties":
          {
            "id": { "type": "string", "maxLength": 128 },
            "component_role":
              {
                "type": "string",
                "enum":
                  ["workload", "launcher", "runtime", "manager", "system"],
              },
            "original_name": { "type": "string" },
            "display_name_zh": { "type": ["string", "null"] },
            "summary":
              {
                "type": ["string", "null"],
                "description": "Locally declared workload purpose; never sent to public metadata or AI providers.",
              },
            "software_summary":
              {
                "type": ["string", "null"],
                "description": "Curated/public software purpose, distinct from the local project's business purpose.",
              },
            "identity_match":
              {
                "type": "string",
                "enum": ["confirmed", "candidate", "unresolved"],
              },
            "public_ids":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/PublicServiceId" },
              },
            "sources":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/KnowledgeSource" },
              },
            "candidates":
              {
                "type": "array",
                "maxItems": 5,
                "items": { "$ref": "#/components/schemas/ServiceCandidate" },
              },
            "enrichment_status":
              {
                "type": "string",
                "enum":
                  [
                    "ready",
                    "queued",
                    "offline",
                    "rate_limited",
                    "no_public_identifier",
                    "disabled",
                    "error",
                  ],
              },
            "updated_at": { "type": ["string", "null"] },
            "stale": { "type": "boolean" },
            "message": { "type": ["string", "null"] },
          },
      }
    ServiceProfilesQuery:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "profile_ids":
              {
                "type": "array",
                "maxItems": 128,
                "items": { "type": "string", "maxLength": 128 },
              },
            "public_ids":
              {
                "type": "array",
                "maxItems": 128,
                "items": { "$ref": "#/components/schemas/PublicServiceId" },
              },
            "refresh":
              {
                "type": "boolean",
                "default": false,
                "description": "Still subject to per-identity cooldown, rate limits and negative cache.",
              },
          },
      }
    ServiceProfilesResult:
      {
        "type": "object",
        "required":
          [
            "profiles",
            "pending_count",
            "online_enabled",
            "ai_configured",
            "ai_enabled",
          ],
        "properties":
          {
            "profiles":
              {
                "type": "array",
                "maxItems": 128,
                "items": { "$ref": "#/components/schemas/ServiceProfile" },
              },
            "pending_count": { "type": "integer", "minimum": 0 },
            "online_enabled": { "type": "boolean" },
            "ai_configured": { "type": "boolean" },
            "ai_enabled": { "type": "boolean" },
          },
      }
    HostContext:
      {
        "type": "object",
        "required":
          [
            "address",
            "kind",
            "is_local",
            "machine_name",
            "hostname",
            "hostname_source",
            "dns_status",
            "os",
            "observed_addresses",
            "resolved_at",
          ],
        "properties":
          {
            "address": { "type": "string" },
            "kind":
              {
                "type": "string",
                "enum":
                  [
                    "local",
                    "loopback",
                    "private",
                    "public",
                    "wildcard",
                    "link_local",
                    "multicast",
                    "unspecified",
                  ],
              },
            "is_local": { "type": "boolean" },
            "machine_name": { "type": ["string", "null"] },
            "hostname": { "type": ["string", "null"] },
            "hostname_source":
              {
                "type": ["string", "null"],
                "enum": ["system", "reverse_dns", null],
              },
            "dns_status":
              {
                "type": "string",
                "enum":
                  [
                    "ready",
                    "queued",
                    "not_found",
                    "timeout",
                    "disabled",
                    "not_applicable",
                    "error",
                  ],
              },
            "os": { "type": ["string", "null"] },
            "observed_addresses":
              {
                "type": "array",
                "maxItems": 128,
                "items": { "type": "string" },
                "description": "Actual scanner socket addresses, not a complete network-interface inventory.",
              },
            "resolved_at": { "type": ["string", "null"] },
          },
      }
    KnowledgeSettings:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["online_enabled", "ai_enabled", "reverse_dns_enabled"],
        "properties":
          {
            "online_enabled": { "type": "boolean", "default": true },
            "ai_enabled": { "type": "boolean", "default": false },
            "reverse_dns_enabled": { "type": "boolean", "default": true },
          },
      }
    KnowledgeConfiguration:
      {
        "type": "object",
        "required":
          [
            "online_enabled",
            "ai_enabled",
            "reverse_dns_enabled",
            "ai_configured",
            "ai_provider",
            "ai_model",
            "can_configure",
          ],
        "properties":
          {
            "online_enabled": { "type": "boolean" },
            "ai_enabled": { "type": "boolean" },
            "reverse_dns_enabled": { "type": "boolean" },
            "ai_configured": { "type": "boolean" },
            "ai_provider": { "type": ["string", "null"] },
            "ai_model": { "type": ["string", "null"] },
            "can_configure":
              {
                "type": "boolean",
                "description": "True only for loopback GUI; LAN is read-only. No endpoint or credentials are returned.",
              },
          },
      }

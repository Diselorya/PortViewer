name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "全部门禁通过后公开 Release（关闭时仅构建产物）"
        type: boolean
        default: false
      expected_sha:
        description: "必须等于本次 checkout 的完整公开提交 SHA"
        type: string
        required: true
      tag:
        description: "发行标签（留空时由 package.json 版本生成）"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Exact SHA / CI / version gate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: verify
        name: Require the exact public commit CI and consistent versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release.mjs --workflow-gate

  windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PORTVIEWER_KNOWLEDGE_OFFLINE: "1"
      PORTVIEWER_KNOWLEDGE_DIR: ${{ github.workspace }}/.tmp/knowledge-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path web-service/Cargo.toml
      - run: cargo build --manifest-path web-service/Cargo.toml
      - run: npm run test:lan-interfaces
      - run: cargo build --release --manifest-path web-service/Cargo.toml
      - run: npm run build:installer:online
      - name: Build offline installer with bounded download recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & npm.cmd run build:installer:offline 2>&1 | Tee-Object -FilePath offline-installer-build.log
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) { exit 0 }
            $buildOutput = Get-Content -LiteralPath offline-installer-build.log -Raw
            $networkFailure = $buildOutput -match '(?i)Peer disconnected|connection (?:reset|aborted|closed)|timed? out|TLS handshake|error sending request|HTTP (?:status )?50[234]'
            if (-not $networkFailure -or $attempt -eq 3) { exit $buildExitCode }
            Write-Host "Transient installer download failure; retry $($attempt + 1)/3."
            Start-Sleep -Seconds (5 * $attempt)
          }
          exit 1
      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/web-assets,release/docs/api | Out-Null
          Copy-Item web-service/target/release/portviewer-web.exe release/
          Copy-Item dist/* release/web-assets/ -Recurse
          Copy-Item README.md,README.zh-CN.md,LICENSE,SECURITY.md release/
          Copy-Item docs/webgui-deployment.md,docs/lan-port-api.md,docs/installation.md,docs/service-knowledge.md release/docs/
          Copy-Item docs/api/portviewer-lan.openapi.yaml release/docs/api/
          Compress-Archive -Path release/* -DestinationPath PortViewer-WebGUI-windows-x64.zip
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName ./PortViewer-windows-x64-setup.exe
          $offline = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $offline) { throw "Offline MSI installer was not produced" }
          Copy-Item $offline.FullName ./PortViewer-windows-x64-offline.msi
          $expected = '${{ needs.gate.outputs.version }}'
          $exeVersion = (Get-Item -LiteralPath './PortViewer-windows-x64-setup.exe').VersionInfo.ProductVersion
          if (($exeVersion -replace '\.0$', '') -ne $expected -and $exeVersion -ne $expected) { throw 'NSIS ProductVersion mismatch' }
          $installerCom = New-Object -ComObject WindowsInstaller.Installer
          $database = $installerCom.OpenDatabase((Resolve-Path './PortViewer-windows-x64-offline.msi').Path, 0)
          $view = $database.OpenView("SELECT Value FROM Property WHERE Property='ProductVersion'")
          $view.Execute()
          if ($view.Fetch().StringData(1) -ne $expected) { throw 'MSI ProductVersion mismatch' }
          if ((Get-Content release/web-assets/portviewer-build-identity.json -Raw | ConvertFrom-Json).productVersion -ne $expected) { throw 'WebGUI version mismatch' }
          Get-FileHash PortViewer-WebGUI-windows-x64.zip,PortViewer-windows-x64-setup.exe,PortViewer-windows-x64-offline.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding utf8NoBOM SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            PortViewer-WebGUI-windows-x64.zip
            PortViewer-windows-x64-setup.exe
            PortViewer-windows-x64-offline.msi
            SHA256SUMS-windows.txt

  linux:
    name: Linux WebGUI artifact
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PORTVIEWER_KNOWLEDGE_OFFLINE: "1"
      PORTVIEWER_KNOWLEDGE_DIR: ${{ github.workspace }}/.tmp/knowledge-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path web-service/Cargo.toml
      - run: cargo build --manifest-path web-service/Cargo.toml
      - run: npm run test:lan-interfaces
      - run: cargo build --release --manifest-path web-service/Cargo.toml
      - name: Package artifact
        run: |
          mkdir -p package/web-assets package/docs/api package/deploy/linux
          cp web-service/target/release/portviewer-web package/
          cp -R dist/. package/web-assets/
          cp README.md README.zh-CN.md LICENSE SECURITY.md package/
          cp docs/webgui-deployment.md docs/lan-port-api.md docs/service-knowledge.md package/docs/
          cp docs/api/portviewer-lan.openapi.yaml package/docs/api/
          cp deploy/linux/portviewer-web.service deploy/linux/portviewer-web-full-attribution.conf package/deploy/linux/
          cp deploy/linux/start.sh package/start.sh
          chmod 755 package/portviewer-web package/start.sh
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("package/web-assets/portviewer-build-identity.json")).productVersion !== process.env.EXPECTED_VERSION) throw Error("WebGUI version mismatch");'
          node scripts/release-runtime.mjs package "$EXPECTED_VERSION"
          tar -C package -czf PortViewer-WebGUI-linux-x64.tar.gz .
          sha256sum PortViewer-WebGUI-linux-x64.tar.gz > SHA256SUMS-linux.txt
        env:
          EXPECTED_VERSION: ${{ needs.gate.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            PortViewer-WebGUI-linux-x64.tar.gz
            SHA256SUMS-linux.txt

  publish:
    name: Publish GitHub release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [gate, windows, linux]
    runs-on: windows-latest
    concurrency:
      group: release-publish-${{ needs.gate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-dist
          merge-multiple: true
      - name: Validate all six assets and publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: node scripts/release.mjs --workflow-publish --assets-dir release-dist
